<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@800&family=JetBrains+Mono:wght@500&display=block');
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#000;overflow:hidden;font-family:'Inter Tight',sans-serif;position:relative}
.glow{position:absolute;left:50%;top:55%;width:1100px;height:1100px;margin:-550px 0 0 -550px;border-radius:50%;background:#D7F75B;filter:blur(220px);opacity:.18;animation:pulse 8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.14;transform:scale(.92)}50%{opacity:.3;transform:scale(1.05)}}
/* bottle */
.bottle{position:absolute;left:50%;bottom:120px;width:300px;height:560px;margin-left:-150px}
.cap{position:absolute;left:70px;top:-70px;width:160px;height:70px;background:#111;border:3px solid #2a2a2a;border-radius:18px 18px 6px 6px}
.body{position:absolute;inset:0;border-radius:44px 44px 70px 70px;border:4px solid rgba(255,255,255,.55);background:linear-gradient(90deg,rgba(255,255,255,.10),rgba(255,255,255,.02) 40%,rgba(255,255,255,.08));overflow:hidden}
.liquid{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,#e6ff7a,#C9EC3E);animation:fill 8s cubic-bezier(.4,.1,.3,1) infinite}
.liquid::before{content:"";position:absolute;left:-20%;right:-20%;top:-18px;height:36px;border-radius:50%;background:#e6ff7a;animation:wave 1.2s ease-in-out infinite alternate}
@keyframes wave{from{transform:translateX(-6%) rotate(-2deg)}to{transform:translateX(6%) rotate(2deg)}}
@keyframes fill{0%,20%{height:0}62%{height:78%}88%{height:78%}97%,100%{height:0}}
.ticks{position:absolute;right:26px;top:90px;display:flex;flex-direction:column;gap:84px;font:500 18px 'JetBrains Mono';color:rgba(255,255,255,.5)}
.ticks i{font-style:normal;border-top:2px solid rgba(255,255,255,.4);width:56px;padding-top:4px}
.word{position:absolute;left:34px;bottom:46px;font-weight:800;font-size:58px;line-height:.86;letter-spacing:-.03em;color:#000;opacity:0;animation:word 8s linear infinite}
@keyframes word{0%,45%{opacity:0}55%,88%{opacity:1}95%,100%{opacity:0}}
.bub{position:absolute;bottom:20px;width:14px;height:14px;border-radius:50%;border:2px solid rgba(0,0,0,.25);opacity:0;animation:bub 2.6s ease-in infinite}
@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-360px);opacity:0}}
/* stick */
.stick{position:absolute;left:50%;top:40px;width:96px;height:420px;margin-left:-48px;transform-origin:50% 100%;animation:stick 8s cubic-bezier(.5,0,.3,1) infinite}
.stick .b{position:absolute;inset:0 0 90px 0;background:#000;border:3px solid #333;border-radius:12px 12px 0 0;display:flex;align-items:center;justify-content:center}
.stick .b span{transform:rotate(-90deg);white-space:nowrap;color:#fff;font-weight:800;font-size:44px;letter-spacing:-.03em}
.stick .t{position:absolute;left:0;right:0;bottom:0;height:90px;background:#D7F75B;border-radius:0 0 12px 12px}
@keyframes stick{0%{transform:translate(560px,-260px) rotate(85deg);opacity:0}8%{opacity:1}18%{transform:translate(30px,-90px) rotate(32deg)}50%{transform:translate(30px,-90px) rotate(32deg);opacity:1}60%{transform:translate(560px,-300px) rotate(80deg);opacity:0}100%{transform:translate(560px,-300px) rotate(80deg);opacity:0}}
/* powder stream */
.stream{position:absolute;left:50%;top:372px;width:16px;margin-left:-8px;height:0;background:linear-gradient(180deg,rgba(215,247,91,.95),rgba(215,247,91,.4));border-radius:8px;filter:blur(1px);animation:stream 8s linear infinite}
@keyframes stream{0%,18%{height:0;opacity:0}22%{height:330px;opacity:1}48%{height:330px;opacity:1}54%,100%{height:0;opacity:0;transform:translateY(330px)}}
.dust{position:absolute;width:6px;height:6px;border-radius:50%;background:#D7F75B;opacity:0;animation:dust 8s linear infinite}
@keyframes dust{0%,20%{opacity:0;transform:translate(0,0)}24%{opacity:.9}50%{opacity:.6;transform:translate(var(--dx),var(--dy))}54%,100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
/* type */
.copy{position:absolute;left:150px;top:50%;transform:translateY(-50%);color:#fff}
.copy .lab{font:500 22px 'JetBrains Mono';letter-spacing:.14em;color:#D7F75B;text-transform:uppercase;opacity:0;animation:in 8s ease infinite}
.copy h1{font-size:120px;line-height:.9;letter-spacing:-.045em;margin-top:20px}
.copy h1 span{display:block;opacity:0;transform:translateY(30px)}
.copy h1 span:nth-child(1){animation:l1 8s cubic-bezier(.2,.7,.2,1) infinite}
.copy h1 span:nth-child(2){animation:l2 8s cubic-bezier(.2,.7,.2,1) infinite}
.copy h1 span:nth-child(3){animation:l3 8s cubic-bezier(.2,.7,.2,1) infinite;color:#D7F75B}
@keyframes in{0%,8%{opacity:0}14%,88%{opacity:1}95%,100%{opacity:0}}
@keyframes l1{0%,14%{opacity:0;transform:translateY(30px)}20%,88%{opacity:1;transform:none}95%,100%{opacity:0;transform:none}}
@keyframes l2{0%,30%{opacity:0;transform:translateY(30px)}36%,88%{opacity:1;transform:none}95%,100%{opacity:0;transform:none}}
@keyframes l3{0%,58%{opacity:0;transform:translateY(30px)}64%,88%{opacity:1;transform:none}95%,100%{opacity:0;transform:none}}
.right{position:absolute;right:150px;top:50%;transform:translateY(-50%);text-align:right;color:#fff}
.right b{display:block;font-size:150px;letter-spacing:-.05em;line-height:.85}
.right small{display:block;margin-top:22px;font:500 22px 'JetBrains Mono';letter-spacing:.12em;color:rgba(255,255,255,.6);text-transform:uppercase}
.right{opacity:0;animation:in2 8s ease infinite}
@keyframes in2{0%,62%{opacity:0}70%,88%{opacity:1}95%,100%{opacity:0}}

.glow{top:62%}
.copy{left:0;right:0;top:110px;transform:none;text-align:center}
.copy h1{font-size:96px}
.right{display:none}
.bottle{bottom:90px}
.stick{top:370px}
.stream{top:702px}
</style></head><body>
<div class="glow"></div>
<div class="copy"><div class="lab">Electrolife Hydration</div><h1><span>One stick.</span><span>500 ml.</span><span>Zero sugar.</span></h1></div>
<div class="right"><b>1,000</b><small>mg sodium per stick</small></div>
<div class="stream"></div>
<div id="dusts"></div>
<div class="stick"><div class="b"><span>ELECTROLIFE</span></div><div class="t"></div></div>
<div class="bottle"><div class="body"><div class="liquid"></div><div class="ticks"><i>500</i><i>400</i><i>300</i><i>200</i></div>
<div id="bubs"></div><div class="word">ELECTRO<br>LIFE</div></div></div>
<script>
var d=document.getElementById('dusts');for(var i=0;i<26;i++){var e=document.createElement('i');e.className='dust';e.style.left=(530+Math.sin(i*7)*14)+'px';e.style.top=(710+((i*37)%320))+'px';e.style.setProperty('--dx',(Math.sin(i*3.1)*60)+'px');e.style.setProperty('--dy',(Math.cos(i*1.7)*40+30)+'px');e.style.animationDelay=(-(i*.07))+'s';d.appendChild(e)}
var b=document.getElementById('bubs');for(var j=0;j<9;j++){var x=document.createElement('i');x.className='bub';x.style.left=(30+j*28)+'px';x.style.animationDelay=(-(j*.31))+'s';b.appendChild(x)}
</script></body></html>
